provenance_note: >-
  REPLACED 2026-09-05. Every previous version of this file was a bulk-sweep SCAFFOLD (roadmap#35):
  invented Free / Professional / Enterprise tiers with invented 1,000 and 100,000 request-per-month
  quotas and invented 10 / 100 / 1,000 rpm rate limits. Calico sells none of those things — it does
  not meter API requests at all. The scaffold is gone and what follows was read off the provider's
  own pricing page.
description: >-
  Calico's real commercial shape. The API in this record — projectcalico.org/v3 — is part of Calico
  Open Source, which is Apache-2.0 and free, and it runs on the operator's own Kubernetes API
  server. There is NO per-request pricing, no request quota and no metered API tier anywhere in the
  product. What Tigera sells is the commercial editions, priced per vCPU-hour or by contract.
