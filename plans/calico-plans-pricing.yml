plans:
  - id: calico-open-source
    name: Calico Open Source
    type: free
    price: '0.00'
    currency: USD
    billing_period: none
    license: Apache-2.0
    description: >-
      The open source project. Networking, network policy and observability across any Kubernetes
      distribution, self-hosted by the operator. This is the edition that serves the
      projectcalico.org/v3 API described in openapi/ and the CRDs in json-schema/.
    quota: none — nothing is metered
    overage: none
    limits: >-
      No provider-imposed limits. The only ceiling is the operator's own Kubernetes API server (see
      rate-limits/calico-rate-limits.yml).
    support: community — Slack, GitHub issues and discussions
    signup_required: false
    elements:
      - Calico CNI and IPAM
      - NetworkPolicy and GlobalNetworkPolicy
      - eBPF, standard Linux and nftables data planes
      - BGP routing
      - calicoctl CLI
      - projectcalico.org/v3 API and CRDs
