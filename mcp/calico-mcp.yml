name: Tigera MCP Server
description: >-
  A live, OAuth-protected remote MCP server operated by Tigera, Inc. — the company that creates and
  maintains Project Calico — on www.tigera.io, the host that also serves Calico's Website, Blog and
  Pricing pages. It was found by following the RFC 9728 protected-resource document, which names the
  endpoint explicitly. This was NOT derived from the Calico OpenAPI: it is a real endpoint that
  answered a real JSON-RPC request.
ownership:
  operator: Tigera, Inc.
  relationship: >-
    Tigera is the creator and maintainer of Project Calico; www.tigera.io is the Website and Blog
    host already declared in this record's apis.yml.
  covers: >-
    HONEST SCOPE CAVEAT — the endpoint lives under /wp-json/mcp/, the WordPress MCP route. It exposes
    the Tigera website's own content surface to agents. It does NOT front the Calico
    projectcalico.org/v3 Kubernetes API, calicoctl, or the Goldmane gRPC flow API. An agent that
    connects here gets Tigera site content, not Calico cluster control.
