description: >-
  Crosswalk between Calico's machine-readable surfaces. The honest headline is that they do NOT
  overlap: the only MCP server reachable from this record is Tigera's website content server, and
  the Calico control surface is REST (projectcalico.org/v3) plus gRPC (Goldmane, Felix, CNI). There
  is no tool that binds to a Calico operationId, and none has been invented to make the table look
  fuller.
