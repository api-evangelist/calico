- version: v3.32.0
  date: '2026-04-30'
  type: minor
  breaking: true
  highlights:
  - Native projectcalico.org/v3 CRDs (tech preview) — the successor to the aggregation API server,
    removing a long-standing source of installation friction on managed Kubernetes platforms.
  - Support for the upstream Kubernetes ClusterNetworkPolicy resource, giving cluster admins
    cluster-scoped rules.
  - Istio ambient mode — mTLS at lower resource cost than sidecar mesh.
  - KubeVirt live migration over BGP.
  - Maglev consistent-hash load balancing.
  breaking_changes:
  - AdminNetworkPolicy and BaselineAdminNetworkPolicy API support REMOVED in favour of
    ClusterNetworkPolicy. These resources must be removed or replaced before upgrade — v3.32 and
    newer will not enforce them. The static adminnetworkpolicy and baselineadminnetworkpolicy tiers
    are removed with them.
  deprecations:
  - Aggregation API server deprecated and scheduled for removal in an upcoming release; migrate to
    native v3 CRDs.
