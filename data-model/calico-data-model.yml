    Every resource is the same four-field Kubernetes envelope — apiVersion (const
    "projectcalico.org/v3"), kind (const, per type), metadata (ObjectMeta), spec. Status subresources
    exist on some kinds but are not in the OpenAPI.
  shared_schemas:
  - ObjectMeta
  - Status
