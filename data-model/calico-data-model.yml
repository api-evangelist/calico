description: >-
  Entity graph for the Calico projectcalico.org/v3 resource API. Calico's model is unusual and worth
  stating plainly: almost nothing references another object BY ID. Resources bind to each other
  through Kubernetes LABEL SELECTORS evaluated at enforcement time. A NetworkPolicy does not hold a
  foreign key to the workloads it protects — it holds a selector string, and membership is whatever
  matches right now. Relationships below are therefore typed `selects` as well as the usual
  has_one/has_many.
