description: >-
  Standards Calico's own contracts declare, plus the compliance programme Tigera publishes for the
  hosted edition. Evidence points at a spec location or a quoted provider page in every row. Rows
  the provider only CLAIMS are marked as such and separated from rows the contract DECLARES.
conformance:
- id: kubernetes-api-conventions
  name: Kubernetes API conventions
  conforms: true
  evidence: >-
    openapi/_original/calico-openapi.yml declares the Kubernetes machinery shapes directly: a
    components.schemas.Status object with kind defaulted to "Status", metadata.resourceVersion, and
    labelSelector/fieldSelector query parameters on every list operation. Those are the
    metav1.Status / metav1.ListOptions / metav1.ObjectMeta contracts, not Calico inventions.
  category: platform
- id: kubernetes-crd-openapiv3
  name: CustomResourceDefinition with structural openAPIV3Schema (apiextensions.k8s.io/v1)
  conforms: true
  evidence: >-
    json-schema/calico-projectcalico.org_*-crd.yaml — 9 published CRDs, each
    apiVersion apiextensions.k8s.io/v1, kind CustomResourceDefinition, group projectcalico.org, with
    a structural openAPIV3Schema per version. Generated by controller-gen v0.18.0.
  category: platform
- id: kubernetes-networkpolicy-api
  name: Kubernetes NetworkPolicy API (networking.k8s.io/v1)
  conforms: true
  evidence: >-
    DOMAIN STANDARD for this market. Calico is a conformant implementation of the upstream
    Kubernetes NetworkPolicy API and extends it with projectcalico.org/v3 NetworkPolicy and
    GlobalNetworkPolicy. Declared throughout
    https://docs.tigera.io/calico/latest/network-policy/get-started/calico-policy/calico-network-policy
    and evidenced by the networkpolicies/globalnetworkpolicies CRDs in json-schema/.
  category: domain-standard
- id: kubernetes-clusternetworkpolicy
