    https://docs.tigera.io/calico/latest/release-notes/
  category: domain-standard
- id: cni-specification
  name: Container Network Interface (CNI) specification
  conforms: true
  evidence: >-
    DOMAIN STANDARD for this market. Calico ships a CNI plugin binary and a CNI config; the
