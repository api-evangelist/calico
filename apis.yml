aid: calico
name: Calico
description: >-
  Calico is an open source networking and network security solution for
  containers, virtual machines, and native host-based workloads. Created and
  maintained by Tigera, it is the most widely adopted solution for container
  networking and security, powering over 8 million nodes daily across 166
  countries.
