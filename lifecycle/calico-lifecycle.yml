deprecated_operations:
  count: 0
  note: >-
    No operation in openapi/ carries `deprecated: true`. The deprecation above is of the SERVING
    MECHANISM and of resource kinds that were never in these specs, so it does not show up as a
    per-operation flag.
archived_repositories:
  note: >-
    Several projectcalico/* repos are archived after being folded into the monorepo — calicoctl,
    libcalico-go, felix, cni-plugin, node, kube-controllers, typha, apiserver, confd, app-policy.
    They are archived because the code MOVED, not because it was abandoned. A pointer to any of
    them is a pointer to a frozen mirror.
